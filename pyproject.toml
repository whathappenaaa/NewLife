[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "niulai-player"
version = "0.6.1"
description = "New Life Windows 文件夹音效播放器、录音与通话混音工具"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Bilibili那年松江" }]
requires-python = ">=3.13,<3.14"
dependencies = [
  "PySide6==6.11.2",
  "PyAudioWPatch==0.2.12.8",
  "numpy>=2.2,<3",
  "soundfile==0.14.0",
  "soxr==1.1.0",
  "Send2Trash>=1.8.3,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pyinstaller==6.22.3"]

[project.urls]
Homepage = "https://github.com/whathappenaaa/NewLife"
Repository = "https://github.com/whathappenaaa/NewLife"
Issues = "https://github.com/whathappenaaa/NewLife/issues"

[project.gui-scripts]
new-life = "niulai_player.app:main"
niulai-player = "niulai_player.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

